[project]
name = "ptmcp"
version = "0.1.5"
description = "MCP server for Cisco Packet Tracer 9. Build, configure and verify networks from an AI agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Atharv Santosh", email = "atharvsantosh1@gmail.com" }]
keywords = ["mcp", "packet-tracer", "cisco", "networking", "ccna", "ios", "automation"]
dependencies = ["mcp>=2.3,<3"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/atharv-santosh/ciscoMCP"
Repository = "https://github.com/atharv-santosh/ciscoMCP"
Issues = "https://github.com/atharv-santosh/ciscoMCP/issues"

[project.scripts]
ptmcp = "ptmcp.cli:main"
packet-tracer-mcp = "ptmcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptmcp"]

[tool.hatch.build.targets.sdist]
include = ["src/ptmcp", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
